name: Auto Build
on:
  schedule:
    - cron: "0 19 * * 5"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a GitHub Release"
        type: boolean
        default: false
      version:
        description: "Release version"
        type: string
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-build:
    name: Auto Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Cache NuGet Packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Add Custom NuGet Source
        run: dotnet nuget add source https://git.crafterbot.com/api/packages/GorillaTagModding/nuget/index.json
      - name: Restore Dependencies
        run: dotnet restore
      - name: Build Project
        env:
          CI: true
        run: dotnet build -c Release --no-restore
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: FancyNametags
          path: |
            FancyNametags/bin/Release/netstandard2.1/FancyNametags.dll
          if-no-files-found: error
          retention-days: 7

      - name: Validate version input
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        run: |
          if [ -z "${{ inputs.version }}" ]; then
            echo "::error::You checked 'release' but left 'version' empty."
            exit 1
          fi

      - name: Pack plugin
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        run: |
          temp="$GITHUB_WORKSPACE/temp/FancyNametags"
          bin="FancyNametags/bin/Release/netstandard2.1"
          mkdir -p "$temp"
          mkdir -p "$temp/LuaEffects"
          cp "$bin/FancyNametags.dll" "$temp/"
          cp "$bin/NLua.dll" "$bin/KeraLua.dll" "$temp/"
          cp LuaEffects/*.lua "$temp/LuaEffects/"
          lua_native="$(find "${NUGET_PACKAGES:-$HOME/.nuget/packages}/keralua" -path '*/runtimes/win-x64/native/lua54.dll' | head -n1)" # kill me
          cp "$lua_native" "$temp/lua54.dll"
          cd "$temp/.."
          zip -r "$GITHUB_WORKSPACE/FancyNametags.zip" FancyNametags

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: FancyNametags.zip
          generate_release_notes: true
